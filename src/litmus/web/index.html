<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Litmus Code Retrieval</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#141a2b;--muted:#5d6479;--line:#e2e5ee;--brand:#1428a0;--brand2:#3b5bdb;
--ok:#0f8a4b;--okbg:#e3f6ec;--bad:#c62828;--badbg:#fdeaea;--warn:#b25e00;--warnbg:#fff2df;--unk:#5d6479;--unkbg:#eef0f5;
--code:#0f1424;--codeink:#e6e9f2}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px}
header h1{margin:0;font-size:20px;letter-spacing:.3px}header .sub{opacity:.85;font-size:13px}
header .model{margin-left:auto;font-size:12px;opacity:.85}
main{display:grid;grid-template-columns:420px 1fr;gap:16px;padding:16px 24px;max-width:1600px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:8px 0 4px}
textarea{width:100%;height:260px;font:12.5px/1.4 Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
select,input[type=number]{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.row{display:flex;gap:10px}.row>div{flex:1}
button{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px}
button.secondary{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button:disabled{opacity:.6;cursor:wait}
.toggle{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--unkbg);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink)}
.chip b{color:var(--brand)}
.stage{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.stage div{background:#f0f3ff;border-radius:8px;padding:8px;text-align:center}
.stage .n{font-size:18px;font-weight:700;color:var(--brand)}.stage .l{font-size:11px;color:var(--muted)}
.hit{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#fff;overflow:hidden}
.hit.gold{border:2px solid #f2b705}
.hh{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.rank{font-weight:800;font-size:18px;width:34px;color:var(--brand)}
.id{font-family:Consolas,monospace;font-weight:600}
.badge{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.pass_all{background:var(--okbg);color:var(--ok)}.pass_partial{background:#eaf4ff;color:#1565c0}
.wrong_answer{background:var(--badbg);color:var(--bad)}.error{background:var(--warnbg);color:var(--warn)}
.unverified,.none{background:var(--unkbg);color:var(--unk)}
.goldtag{background:#fff3c4;color:#7a5b00;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.move{font-size:12px;color:var(--muted)}.move b{color:var(--ok)}.move i{color:var(--bad);font-style:normal;font-weight:700}
.meta{margin-left:auto;font-size:12px;color:var(--muted);font-family:Consolas,monospace}
pre{margin:0;background:var(--code);color:var(--codeink);padding:12px;font:12px/1.45 Consolas,monospace;overflow:auto;max-height:340px}
.body{display:none}.hit.open .body{display:block}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;padding:10px 12px;background:#fafbfe}
.case{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;background:#fff}
.case pre{max-height:90px;padding:6px;font-size:11px}
.muted{color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}
.vers{font-size:11px}.vers span{background:#eef1fb;color:#2b3a8c;border-radius:4px;padding:1px 6px;margin-right:3px}
#timeline{position:fixed;inset:0;background:rgba(10,14,30,.55);display:none;align-items:center;justify-content:center;padding:20px}
#timeline .panel{background:#fff;border-radius:12px;max-width:1100px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.examples pre{max-height:120px}
</style>
</head>
<body>
<header>
  <div><h1>Litmus</h1><div class="sub">Execution-verified, version-aware code retrieval</div></div>
  <div class="model" id="model"></div>
</header>
<main>
  <section>
    <div class="card">
      <label for="sample">Sample query (real CoIR-apps test queries)</label>
      <select id="sample"><option value="">- choose a sample or type your own -</option></select>
      <label for="q">Query</label>
      <textarea id="q" placeholder="Paste a programming task (with or without sample tests) or a natural-language question..."></textarea>
      <div class="row">
        <div><label for="store">Store</label><select id="store"></select></div>
        <div><label for="version">Version</label><select id="version"></select></div>
        <div style="max-width:80px"><label for="k">Top-k</label><input id="k" type="number" value="10" min="1" max="50"></div>
      </div>
      <div class="toggle"><input type="checkbox" id="verify" checked><label for="verify" style="margin:0;display:inline">Execution verification (pass 2 &amp; 3)</label></div>
      <div class="row" style="margin-top:12px">
        <button id="go">Search</button>
        <button class="secondary" id="compare">Compare: dense-only vs verified</button>
      </div>
    </div>
    <div class="card" style="margin-top:14px" id="analysis"><div class="muted">Query analysis appears here.</div></div>
  </section>
  <section>
    <div class="card" id="summary"><div class="muted">Pipeline: analyse &rarr; dense retrieval (F2LLM-v2-0.6B, CPU) &rarr; execute top-K on the query's own examples in a sandbox &rarr; expand if nothing verifies &rarr; evidence fusion.</div></div>
    <div id="results"><div class="empty">Choose a sample query and press Search.</div></div>
  </section>
</main>
<div id="timeline"><div class="panel"><div style="display:flex;align-items:center"><h3 style="margin:0" id="tltitle">History</h3><button class="secondary" style="margin-left:auto" onclick="closeTL()">Close</button></div><div class="tl" id="tlbody"></div></div></div>
<script>
const $ = id => document.getElementById(id);
let INFO = null, GOLD = null;
const esc = s => (s ?? "").toString().replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const TIER = {pass_all:"PASS", pass_partial:"PARTIAL", wrong_answer:"WRONG ANSWER", error:"RUNTIME ERROR", unverified:"CAN'T RUN"};

async function init(){
  INFO = await (await fetch("/api/info")).json();
  $("model").textContent = INFO.model + " · CPU · verify top-" + INFO.k_verify + " (+" + INFO.k_expand + ")";
  const stores = Object.keys(INFO.stores);
  $("store").innerHTML = stores.map(s => `<option>${s}</option>`).join("");
  $("store").onchange = fillVersions; fillVersions();
  const samples = await (await fetch("/api/samples")).json();
  $("sample").innerHTML += samples.map(s => `<option value="${s.id}">${s.id}${s.evolving ? " [evolves]" : ""} — ${esc(s.title)}</option>`).join("");
  $("sample").onchange = async () => { if(!$("sample").value) return; const s = await (await fetch("/api/sample/" + $("sample").value)).json(); $("q").value = s.text; };
  $("go").onclick = () => run(false); $("compare").onclick = () => run(true);
  // Deep links (used for reproducible screenshots): ?sample=q5301&store=apps-demo&version=all&compare=1&open=3
  const P = new URLSearchParams(location.search);
  if(P.get("store")){ $("store").value = P.get("store"); fillVersions(); }
  if(P.get("version")) $("version").value = P.get("version");
  if(P.get("k")) $("k").value = P.get("k");
  if(P.get("sample")){
    $("sample").value = P.get("sample");
    const s = await (await fetch("/api/sample/" + P.get("sample"))).json(); $("q").value = s.text;
    await run(P.get("compare") === "1");
    const nOpen = +(P.get("open") || 1);
    document.querySelectorAll(".hit").forEach((h, i) => h.classList.toggle("open", i < nOpen));
    if(P.get("history")) await showTL(P.get("history"));
    document.body.setAttribute("data-ready", "1");
  }
}
function fillVersions(){
  const vs = INFO.stores[$("store").value] || [];
  $("version").innerHTML = vs.slice().reverse().map((v, i) => `<option value="${v.name}">${v.name}${i === 0 ? " (latest)" : ""} · ${v.snippets} snippets</option>`).join("") + (vs.length > 1 ? `<option value="all">ALL versions (evolutionary)</option>` : "");
}
async function search(verify){
  const body = {query: $("q").value, store: $("store").value, version: $("version").value, k: +$("k").value, verify};
  const r = await fetch("/api/search", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function run(compare){
  if(!$("q").value.trim()) return;
  $("go").disabled = $("compare").disabled = true;
  $("results").innerHTML = `<div class="empty">Searching…</div>`;
  try{
    if(compare){
      const dense = await search(false), ver = await search(true);
      render(ver, dense);
    } else {
      render(await search($("verify").checked), null);
    }
  } catch(e){ $("results").innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; }
  $("go").disabled = $("compare").disabled = false;
}
let GOLD_SHA = null;
function goldOf(h, gold){ return gold && (h.id === gold || (h.meta && h.meta.uid === gold)) && (!GOLD_SHA || h.sha === GOLD_SHA); }
function lineageOf(h, gold){ return gold && h.meta && h.meta.uid === gold && GOLD_SHA && h.sha !== GOLD_SHA; }
function render(res, dense){
  GOLD = res.gold; GOLD_SHA = res.gold_sha;
  const p = res.profile, t = res.timings_ms, st = res.stats;
  $("analysis").innerHTML = `<b>Query analysis</b><div class="chips" style="margin-top:8px">
    <span class="chip">kind <b>${p.kind}</b></span><span class="chip">language <b>${p.language}</b></span>
    <span class="chip">style <b>${p.platform}</b></span><span class="chip">examples <b>${p.n_examples}</b></span>
    <span class="chip">verifiable <b>${p.verifiable ? "yes" : "no"}</b></span></div>
    ${res.examples.length ? `<div class="examples" style="margin-top:10px">${res.examples.map((e,i)=>`<div class="muted" style="margin-top:6px">Example ${i+1}: input &rarr; expected output</div><div class="row"><pre>${esc(e.input)}</pre><pre>${esc(e.output)}</pre></div>`).join("")}</div>` : ""}`;
  const tiers = st.tiers || {};
  let denseLine = "";
  if(dense){
    const dRank = dense.hits.findIndex(h => goldOf(h, res.gold)) + 1, vRank = res.hits.findIndex(h => goldOf(h, res.gold)) + 1;
    if(res.gold) denseLine = `<div style="margin-top:8px;font-size:15px">Ground-truth solution <span class="id">${res.gold}</span>: dense-only rank <b>${dRank || ">" + dense.hits.length}</b> &rarr; Litmus rank <b style="color:var(--ok)">${vRank || ">" + res.hits.length}</b></div>`;
  }
  $("summary").innerHTML = `<div class="stage">
    <div><div class="n">${Math.round(t.embed_query)}<small> ms</small></div><div class="l">embed query${st.query_embedding_cached ? " (cached)" : ""}</div></div>
    <div><div class="n">${t.dense_search.toFixed(1)}<small> ms</small></div><div class="l">dense search · ${st.candidates} snippets</div></div>
    <div><div class="n">${Math.round(t.verify)}<small> ms</small></div><div class="l">verify ${st.verified} candidates${st.expanded ? " (expanded)" : ""}</div></div>
    <div><div class="n">${tiers.pass_all || 0}</div><div class="l">pass all examples</div></div>
    <div><div class="n">${Math.round(t.total)}<small> ms</small></div><div class="l">total</div></div></div>
    <div class="muted">view <span class="id">${esc(st.view)}</span> · wrong-answer ${tiers.wrong_answer||0} · runtime-error ${tiers.error||0} · can't-run ${tiers.unverified||0}</div>${denseLine}`;
  $("results").innerHTML = res.hits.map((h, i) => hitHTML(h, res.gold, i === 0)).join("") || `<div class="empty">No results</div>`;
}
function hitHTML(h, gold, open){
  const v = h.verification, tier = v ? v.tier : "none";
  const badge = v ? `<span class="badge ${tier}">${TIER[tier]} ${v.passed}/${v.total}</span>` : `<span class="badge none">not executed</span>`;
  const mv = h.dense_rank !== h.rank ? (h.dense_rank > h.rank ? `<span class="move">dense #${h.dense_rank} <b>&uarr;</b></span>` : `<span class="move">dense #${h.dense_rank} <i>&darr;</i></span>`) : `<span class="move">dense #${h.dense_rank}</span>`;
  const vers = h.meta && h.meta.versions ? `<span class="vers">${h.meta.versions.map(x => `<span>${x}</span>`).join("")}</span>` : "";
  const g = goldOf(h, gold) ? `<span class="goldtag">GROUND TRUTH</span>` : (lineageOf(h, gold) ? `<span class="badge none">modified version of ground truth</span>` : "");
  const uid = (h.meta && h.meta.uid) || h.id;
  const cases = v && v.cases.length ? `<div class="cases">${v.cases.map((c, j) => `<div class="case"><b>Example ${j+1}: ${c.status}</b> <span class="muted">${(c.seconds*1000).toFixed(1)} ms</span>${c.error ? `<div class="muted">${esc(c.error)}</div>` : ""}<div class="row" style="margin-top:4px"><div><div class="muted">got</div><pre>${esc(c.got)}</pre></div><div><div class="muted">expected</div><pre>${esc(c.expected)}</pre></div></div></div>`).join("")}</div>` : "";
  return `<div class="hit ${open ? "open" : ""} ${goldOf(h, gold) ? "gold" : ""}"><div class="hh" onclick="this.parentElement.classList.toggle('open')">
    <span class="rank">#${h.rank}</span><span class="id">${esc(h.id)}</span>${badge}${g}${mv}${vers}
    <span class="meta">cos ${h.dense.toFixed(4)} · score ${h.score.toFixed(2)}${v && v.variant !== "as_is" ? " · run as " + v.variant : ""} · <a href="#" onclick="event.stopPropagation();showTL('${esc(uid)}');return false">history</a></span></div>
    <div class="body"><pre>${esc(h.text)}</pre>${cases}</div></div>`;
}
async function showTL(uid){
  const hist = await (await fetch(`/api/lineage?store=${encodeURIComponent($("store").value)}&uid=${encodeURIComponent(uid)}`)).json();
  $("tltitle").textContent = "History of " + uid;
  const seen = {};
  $("tlbody").innerHTML = hist.map(h => { const rev = h.sha && h.changed && seen[h.sha]; if(h.sha && !seen[h.sha]) seen[h.sha] = h.version;
    const tag = !h.sha ? '<span class="badge wrong_answer">deleted</span>' : rev ? `<span class="badge pass_all">reverted to ${rev}</span>` : (h.changed ? '<span class="badge pass_partial">changed</span>' : '<span class="badge none">unchanged</span>');
    return `<div><b>${h.version}</b> ${tag} <span class="muted">${h.sha ? h.sha.slice(0,10) : ""}</span><pre>${esc(h.text || "")}</pre></div>`; }).join("");
  $("timeline").style.display = "flex";
}
function closeTL(){ $("timeline").style.display = "none"; }
init();
</script>
</body>
</html>
